version: 2

models:
  - name: dim_location
    description: "Dimension table containing location-level attributes."

    columns:
      - name: location_key
        description: "Surrogate key generated from the city name."
        tests:
          - not_null
          - unique

      - name: city
        description: "City name."
        tests:
          - not_null
          - unique

      - name: country
        description: "Country where the city is located."
        tests:
          - not_null

      - name: population
        description: "Population of the city."

      - name: avg_income
        description: "Average income for the city."

      - name: latitude
        description: "Latitude coordinate of the city."

      - name: longitude
        description: "Longitude coordinate of the city."

  - name: dim_campaigns
    description: "Campaign dimension containing marketing campaign attributes."

    columns:
      - name: campaign_key
        description: "Surrogate key for the campaign dimension."
        data_tests:
          - not_null
          - unique

      - name: campaign_id
        description: "Natural key from the source marketing campaign system."
        data_tests:
          - not_null
          - unique

      - name: campaign_name
        data_tests:
          - not_null

      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              values:
                - Email
                - Social Media
                - Google Ads
                - Facebook
                - Instagram
                - TV

      - name: location_key
        data_tests:
          - not_null

      - name: start_date
        data_tests:
          - not_null

      - name: end_date
        data_tests:
          - not_null

      - name: budget
        data_tests:
          - not_null

      - name: spend
        data_tests:
          - not_null

  - name: dim_date
    description: "Calendar dimension containing one row per calendar date."

    columns:
      - name: date_key
        description: "Surrogate date key in YYYYMMDD format."
        data_tests:
          - not_null
          - unique

      - name: date_day
        data_tests:
          - not_null
          - unique

      - name: year
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

      - name: day_of_month
        data_tests:
          - not_null

      - name: day_of_week
        data_tests:
          - not_null
          
  - name: dim_stores
    description: "Store dimension containing one row per store."

    columns:
      - name: store_key
        description: "Warehouse surrogate key for the store."
        data_tests:
          - not_null
          - unique

      - name: store_id
        description: "Business key originating from the source system."
        data_tests:
          - not_null
          - unique

      - name: store_name
        data_tests:
          - not_null
          - unique

      - name: location_key
        data_tests:
          - not_null

      - name: opened_at
        data_tests:
          - not_null

  - name: dim_products
    description: "Product dimension containing one row per product."

    columns:
      - name: product_key
        description: "Warehouse surrogate key for the product."
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: "Business key originating from the source system."
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: category
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension containing one row per customer."

    columns:
      - name: customer_key
        description: "Warehouse surrogate key for the customer."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Business key originating from the source system."
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null