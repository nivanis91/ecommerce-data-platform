version: 1

models:
  - name: dim_date
    description: "Calendar dimension containing one row per calendar date."

    columns:
      - name: date_key
        description: "Surrogate date key in YYYYMMDD format."
        data_tests:
          - not_null
          - unique

      - name: date_day
        data_tests:
          - not_null
          - unique

      - name: year
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

      - name: day_of_month
        data_tests:
          - not_null

      - name: day_of_week
        data_tests:
          - not_null
          
  - name: dim_stores
    description: "Store dimension containing one row per store."

    columns:
      - name: store_key
        description: "Warehouse surrogate key for the store."
        data_tests:
          - not_null
          - unique

      - name: store_id
        description: "Business key originating from the source system."
        data_tests:
          - not_null
          - unique

      - name: store_name
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null

      - name: opened_at
        data_tests:
          - not_null

  - name: dim_products
    description: "Product dimension containing one row per product."

    columns:
      - name: product_key
        description: "Warehouse surrogate key for the product."
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: "Business key originating from the source system."
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: category
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension containing one row per customer."

    columns:
      - name: customer_key
        description: "Warehouse surrogate key for the customer."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Business key originating from the source system."
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null