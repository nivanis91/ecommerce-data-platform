version: 2

models:
  - name: dim_customers
    description: "Customer dimension containing one row per customer."

    columns:
      - name: customer_key
        description: "Warehouse surrogate key for the customer."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Business key originating from the source system."
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null